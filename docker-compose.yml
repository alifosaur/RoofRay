services:
  postgres:
    image: postgres:16-alpine
    container_name: sunpower_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sunpower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sunpower_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-sunpower_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sunpower} -d $${POSTGRES_DB:-sunpower_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sunpower_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sunpower_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sunpower}:${POSTGRES_PASSWORD:-sunpower_secure_password}@postgres:5432/${POSTGRES_DB:-sunpower_db}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: "/app/uploads"
      SECRET_KEY: "${SECRET_KEY:-sunpower-super-secret-key-production-ready}"
      PORT: "${BACKEND_PORT:-8000}"
      HOST: "0.0.0.0"
      BACKEND_PORT: "${BACKEND_PORT:-8000}"
      FRONTEND_PORT: "${FRONTEND_PORT:-5173}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-http://localhost:5173}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sunpower_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
